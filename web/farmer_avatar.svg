<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#d97706" />
  <circle cx="50" cy="50" r="46" fill="#14532d" />
  
  <!-- Kurta/Shirt Collar -->
  <path d="M22 96 C24 72, 34 68, 50 68 C66 68, 76 72, 78 96 Z" fill="#f8fafc" />
  <path d="M44 68 L50 78 L56 68 Z" fill="#e2e8f0" />
  <path d="M30 96 C32 80, 40 76, 50 76 C60 76, 68 80, 70 96 Z" fill="#f1f5f9" />
  
  <!-- Neck -->
  <rect x="42" y="54" width="16" height="18" rx="4" fill="#c68642" />
  
  <!-- Face -->
  <ellipse cx="50" cy="46" rx="19" ry="21" fill="#d99b61" />
  
  <!-- Ears -->
  <circle cx="30" cy="47" r="5" fill="#c68642" />
  <circle cx="70" cy="47" r="5" fill="#c68642" />
  
  <!-- Eyes -->
  <ellipse cx="43" cy="43" rx="2.5" ry="2" fill="#1e293b" />
  <ellipse cx="57" cy="43" rx="2.5" ry="2" fill="#1e293b" />
  <!-- Eye glint -->
  <circle cx="44" cy="42" r="0.8" fill="#ffffff" />
  <circle cx="58" cy="42" r="0.8" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M38 39 Q43 37 47 40" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M62 39 Q57 37 53 40" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none" />
  
  <!-- Nose -->
  <path d="M50 43 L48 51 L52 51 Z" fill="#bf7a3a" opacity="0.6" />
  
  <!-- Indian Mustache -->
  <path d="M38 56 Q44 54 50 56 Q56 54 62 56 Q56 59 50 58 Q44 59 38 56 Z" fill="#1e293b" />
  
  <!-- Warm Smile -->
  <path d="M45 60 Q50 63 55 60" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Traditional Saffron / Orange Indian Turban (Pagri) -->
  <!-- Base Wrap Fold 1 -->
  <ellipse cx="50" cy="27" rx="25" ry="16" fill="#ea580c" />
  <!-- Fold 2 Overlap -->
  <path d="M25 32 C26 16, 46 12, 68 18 C78 22, 76 34, 73 36 C64 30, 36 28, 25 32 Z" fill="#f97316" />
  <!-- Fold 3 Top Swirl -->
  <path d="M30 22 C34 10, 56 8, 68 14 C62 10, 42 12, 34 20 Z" fill="#fdba74" />
  <!-- Front Turban Knot / Turra -->
  <path d="M46 14 C48 8, 54 8, 56 14 C54 18, 48 18, 46 14 Z" fill="#fb923c" />
  <path d="M28 30 C38 36, 62 36, 72 30 C74 34, 68 38, 50 38 C32 38, 26 34, 28 30 Z" fill="#c2410c" />
</svg>
