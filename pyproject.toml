[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-agent"
version = "0.1.0"
description = "The Sub-50ms Type-Safe Dual-Brain AI Agent Framework powered by Laya and Jev"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Reflex Agent Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "laya>=0.3.20",
    "typesafe-sdk>=0.7.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "rich>=13.8.0",
    "typer>=0.20.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "websockets>=17.0.0",
    "litellm>=1.98.0",
    "python-dotenv>=1.2.0"
]

[project.scripts]
reflex = "reflex_agent.cli.main:app"
reflex-bench = "reflex_agent.benchmarks.comparison:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reflex_agent*"]
